<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영타 → 한글 변환기</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: #0f172a; color: #e2e8f0;
         display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p.sub { color: #94a3b8; margin: 0 0 24px; }
  .mode { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode button { flex: 1; padding: 10px; border: 1px solid #334155; background: #1e293b; color: #cbd5e1;
                 border-radius: 8px; cursor: pointer; font-size: 15px; }
  .mode button.active { background: #6366f1; border-color: #6366f1; color: white; }
  label { display: block; font-size: 13px; color: #94a3b8; margin: 14px 0 6px; }
  textarea { width: 100%; height: 130px; padding: 14px; font-size: 18px; border-radius: 10px;
             border: 1px solid #334155; background: #1e293b; color: #f1f5f9; resize: vertical; font-family: inherit; }
  textarea:focus { outline: 2px solid #6366f1; border-color: transparent; }
  #output { background: #111827; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { padding: 8px 16px; border: none; border-radius: 8px; background: #334155; color: #e2e8f0; cursor: pointer; }
  .actions button:hover { background: #475569; }
  .hint { margin-top: 24px; font-size: 13px; color: #64748b; line-height: 1.7; }
  code { background: #1e293b; padding: 1px 6px; border-radius: 4px; color: #a5b4fc; }
</style>
</head>
<body>
<div class="wrap">
  <h1>영타 → 한글 변환기</h1>
  <p class="sub">한/영 안 바꾸고 친 글자를 한글로 바꿔줌 (두벌식 기준)</p>

  <div class="mode">
    <button id="m1" class="active">영타 → 한글</button>
    <button id="m2">한글 → 영타</button>
  </div>

  <label id="inLabel">입력 (영타)</label>
  <textarea id="input" placeholder="dkssudgktpdy" autofocus></textarea>

  <label id="outLabel">결과 (한글)</label>
  <textarea id="output" readonly></textarea>

  <div class="actions">
    <button id="copy">복사</button>
    <button id="swap">결과를 입력으로</button>
    <button id="clear">지우기</button>
  </div>

  <div class="hint">
    예시: <code>dkssudgktpdy</code> → 안녕하세요 &nbsp;|&nbsp; <code>Rkcl</code> → 까치 &nbsp;|&nbsp; <code>Tkfkd</code> → 싸랑<br>
    대문자 <code>Q W E R T O P</code> = ㅃ ㅉ ㄸ ㄲ ㅆ ㅒ ㅖ, 나머지 대문자는 소문자랑 똑같이 처리됨
  </div>
</div>

<script src="converter.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let mode = 'e2k';

  const run = () => {
    $('output').value = mode === 'e2k' ? engToKor($('input').value) : korToEng($('input').value);
  };
  const setMode = (m) => {
    mode = m;
    $('m1').classList.toggle('active', m === 'e2k');
    $('m2').classList.toggle('active', m === 'k2e');
    $('inLabel').textContent = m === 'e2k' ? '입력 (영타)' : '입력 (한글)';
    $('outLabel').textContent = m === 'e2k' ? '결과 (한글)' : '결과 (영타)';
    $('input').placeholder = m === 'e2k' ? 'dkssudgktpdy' : '안녕하세요';
    run();
  };

  $('input').addEventListener('input', run);
  $('m1').onclick = () => setMode('e2k');
  $('m2').onclick = () => setMode('k2e');
  $('copy').onclick = () => {
    navigator.clipboard.writeText($('output').value);
    $('copy').textContent = '복사됨';
    setTimeout(() => ($('copy').textContent = '복사'), 1200);
  };
  $('swap').onclick = () => { $('input').value = $('output').value; setMode(mode === 'e2k' ? 'k2e' : 'e2k'); };
  $('clear').onclick = () => { $('input').value = ''; run(); $('input').focus(); };
</script>
</body>
</html>
